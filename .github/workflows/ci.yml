name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: vault-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Core contract tests
        run: npm test
      - name: 10k search benchmark
        run: npm run benchmark:search
      - name: 10k knowledge graph benchmark
        run: npm run benchmark:graph
      - name: 10k board projection benchmark
        run: npm run benchmark:board
      - name: Maximum-size Canvas benchmark
        run: npm run benchmark:canvas
      - name: 10k Obsidian migration benchmark
        run: npm run benchmark:interop
      - name: Sync foundation benchmark
        run: npm run benchmark:sync-foundation
      - name: Remote replication benchmark
        run: npm run benchmark:replication
      - name: Continuous sync hardening benchmark
        run: npm run benchmark:sync-hardening
      - name: Realtime wakeup benchmark
        run: npm run benchmark:realtime-wakeup
      - name: Collaboration presence benchmark
        run: npm run benchmark:collaboration
      - name: CRDT collaboration benchmark
        run: npm run benchmark:crdt
      - name: Conflict resolver benchmark
        run: npm run benchmark:conflicts
      - name: Encrypted remote-state benchmark
        run: npm run benchmark:i4-remote-state
      - name: Multi-device reconciliation benchmark
        run: npm run benchmark:i6-conflicts
      - name: Encrypted blob crypto benchmark
        run: npm run benchmark:i7-blobs
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Chromium desktop/mobile acceptance
        run: npm run test:e2e
