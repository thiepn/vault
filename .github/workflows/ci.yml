name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: vault-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Core contract tests
        run: npm test
      - name: 10k search benchmark
        run: npm run benchmark:search
      - name: 10k knowledge graph benchmark
        run: npm run benchmark:graph
      - name: 10k board projection benchmark
        run: npm run benchmark:board
      - name: Maximum-size Canvas benchmark
        run: npm run benchmark:canvas
      - name: 10k Obsidian migration benchmark
        run: npm run benchmark:interop
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Chromium desktop/mobile acceptance
        run: npm run test:e2e
