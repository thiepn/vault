name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact declared dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Core contract tests
        run: npm test
      - name: Production build
        run: npm run build
